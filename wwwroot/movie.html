<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="description" id="metaDescription" content="Xem phim online chất lượng cao 4K trên SunPhim">
    <meta property="og:title" id="ogTitle" content="SunPhim">
    <meta property="og:description" id="ogDescription" content="">
    <meta property="og:image" id="ogImage" content="">
    <meta property="og:type" content="video.movie">
    <title id="pageTitle">SunPhim - Đang tải thông tin phim...</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/netflix.css?v=20261008_v1">
    <script type="application/ld+json" id="schemaMarkup"></script>
</head>
<body>
    <!-- Header -->
    <header class="header scrolled" id="header">
        <div class="header-container">
            <div class="header-left">
                <a href="/" class="logo">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 3h16a1 1 0 0 1 1 1v4.5a2.5 2.5 0 0 1-5 0V5H4v13h1a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1H4V4a1 1 0 0 1 1-1z"/>
                    </svg>
                    <span>SUN<b>PHIM</b></span>
                </a>
                <nav class="nav-main" id="navMain">
                    <a href="/" class="nav-link" data-nav="home">Trang chủ</a>
                    <a href="/phim-bo" class="nav-link" data-nav="series">Phim bộ</a>
                    <a href="/phim-le" class="nav-link" data-nav="single">Phim lẻ</a>
                    <a href="/the-loai" class="nav-link" data-nav="genres">Thể loại</a>
                    <a href="/danh-sach" class="nav-link" data-nav="watchlist">Danh sách của tôi</a>
                </nav>
            </div>
            <div class="header-right">
                <a href="/" class="btn btn-secondary" style="font-size:0.85rem; padding:0.45rem 1.1rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    </svg>
                    Trang chủ
                </a>
            </div>
        </div>
    </header>

    <!-- Detail Hero Section -->
    <section class="detail-hero" id="detailHero">
        <div class="detail-hero-content">
            <div class="detail-poster" id="detailPosterWrap">
                <img id="detailPoster" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 2 3'%3E%3C/svg%3E" alt="Poster phim" referrerpolicy="no-referrer">
            </div>
            <div class="detail-info">
                <h1 class="detail-title" id="detailTitle">Đang tải tên phim...</h1>
                <p class="detail-original-title" id="detailOriginName"></p>
                <div class="detail-meta" id="detailMeta"></div>
                <div class="detail-tags" id="detailTags"></div>
                <div class="detail-actions" id="detailActions"></div>
                <div class="detail-description" id="detailDescription"></div>
            </div>
        </div>
    </section>

    <!-- Episodes Section -->
    <section class="episodes-section" id="episodesSection">
        <div class="episodes-header">
            <div>
                <h2 class="episodes-title" id="episodesTitle">Danh sách tập phát sóng</h2>
                <span style="color:var(--text-muted); font-size:0.85rem;" id="episodesTotalLabel"></span>
            </div>
            <div style="display:flex; align-items:center; gap:0.8rem;">
                <input type="text" class="episodes-search-input" id="movieDetailEpisodeSearch" placeholder="Tìm số tập...">
            </div>
        </div>
        <div class="episodes-grid" id="episodesGrid"></div>

        <!-- Similar Movies Carousel -->
        <div style="margin-top:4rem;" id="similarMoviesWrap">
            <div class="section-header">
                <h3 class="section-title">Phim cùng thể loại gợi ý</h3>
            </div>
            <div class="movie-row">
                <button class="movie-row-nav nav-prev" data-target="similarRow" aria-label="Lùi">‹</button>
                <div class="movie-row-inner" id="similarRow"></div>
                <button class="movie-row-nav nav-next" data-target="similarRow" aria-label="Tiến">›</button>
            </div>
        </div>
    </section>

    <!-- Toast Alerts -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/api.js?v=20261008_v1"></script>
    <script src="/js/app.js?v=20261008_v1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            window.scrollTo({ top: 0, behavior: 'instant' });
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            if (slug) {
                loadMovieDetailPage(slug);
            } else {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
